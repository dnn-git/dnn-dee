[package]
name = "dnn-dee"
version = "1.0.0"
edition = "2021"
description = "Dee Offline Music - trình phát nhạc ngoại tuyến (GTK4 + GStreamer)"
license = "GPL-3.0-only"

[dependencies]
gtk = { package = "gtk4", version = "0.10", features = ["v4_12"] }
gstreamer = "0.24"
serde_json = "1"

[profile.release]
lto = true
strip = true

[package.metadata.deb]
maintainer = "dnn <jxj8386@hotmail.com>"
extended-description = "Dee là trình phát nhạc ngoại tuyến đơn giản viết bằng Rust, GTK4 và GStreamer."
section = "sound"
priority = "optional"
depends = "$auto, gstreamer1.0-plugins-base, gstreamer1.0-plugins-good, gstreamer1.0-libav"
assets = [
    ["target/release/dnn-dee", "usr/bin/", "755"],
    ["vn.dnn.Dee.desktop", "usr/share/applications/", "644"],
    ["icons/vn.dnn.Dee.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["icons/vn.dnn.Dee-32.png", "usr/share/icons/hicolor/32x32/apps/vn.dnn.Dee.png", "644"],
    ["icons/vn.dnn.Dee-48.png", "usr/share/icons/hicolor/48x48/apps/vn.dnn.Dee.png", "644"],
    ["icons/vn.dnn.Dee-64.png", "usr/share/icons/hicolor/64x64/apps/vn.dnn.Dee.png", "644"],
    ["icons/vn.dnn.Dee-128.png", "usr/share/icons/hicolor/128x128/apps/vn.dnn.Dee.png", "644"],
    ["icons/vn.dnn.Dee-256.png", "usr/share/icons/hicolor/256x256/apps/vn.dnn.Dee.png", "644"],
    ["icons/vn.dnn.Dee-512.png", "usr/share/icons/hicolor/512x512/apps/vn.dnn.Dee.png", "644"],
]
